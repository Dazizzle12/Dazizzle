<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIDE AND SEEK APP - KINGDOM EDITION</title>
    <style>
        :root {
            --neon-blue: #00ccff;
            --neon-red: #ff3333;
            --neon-green: #00ff66;
            --mario-yellow: #ffcc00;
            --bg-dark: #0a0a0a;
            --panel-bg: rgba(21, 21, 21, 0.9);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
        }

        /* HINTERGRUND SETUP */
        .bg-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Sanfter linearer Zoom ohne Zittern */
            animation: smoothZoom 40s linear infinite alternate;
            will-change: transform;
            transition: background-image 0.8s ease-in-out;
            background-color: #111;
            /* Nur eine leichte Abdunklung, kein Raster-Effekt mehr */
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url("https://i.imgur.com/ypKK0F8.png");
        }

        @keyframes smoothZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        body {
            color: white;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 700;
            font-style: italic; 
            text-transform: uppercase; 
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            /* Der Scanline-Effekt (body::before) wurde hier entfernt */
        }

        /* HEADER & NAVIGATION */
        .section-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }

        .back-btn { 
            position: absolute;
            top: 0;
            left: 0;
            margin: 10px; 
            color: #eee; 
            cursor: pointer; 
            background: rgba(0,0,0,0.7); 
            border: 1px solid #444; 
            padding: 8px 20px; 
            z-index: 30;
            transform: skewX(-10deg);
        }

        .logo-container {
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            z-index: 25;
            text-align: center;
        }

        .main-logo {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(0, 204, 255, 0.5));
        }

        /* BOX-ANIMATIONEN */
        .item-box-placeholder {
            width: 140px;
            height: 140px;
            background-image: url('https://i.imgur.com/0BgUWJt.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: itemBoxFloat 2s ease-in-out infinite, itemBoxRotate 4s linear infinite;
            filter: drop-shadow(0 0 15px var(--mario-yellow));
            transition: opacity 0.1s;
        }

        @keyframes itemBoxFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        @keyframes itemBoxRotate {
            0% { filter: drop-shadow(0 0 15px var(--mario-yellow)) hue-rotate(0deg); }
            100% { filter: drop-shadow(0 0 15px var(--mario-yellow)) hue-rotate(360deg); }
        }

        /* SHATTER EFFEKT */
        .shatter-container {
            position: absolute;
            width: 140px;
            height: 140px;
            pointer-events: none;
            display: none;
            z-index: 50;
        }

        .shatter-piece {
            position: absolute;
            width: 35px; 
            height: 35px; 
            background-image: url('https://i.imgur.com/0BgUWJt.png');
            background-size: 140px 140px;
            background-repeat: no-repeat;
            will-change: transform, opacity;
        }

        .shatter-active .shatter-piece {
            animation: explodePiece 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes explodePiece {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate(var(--tr)) scale(0); opacity: 0; }
        }

        /* BUTTONS */
        .kingdom-btn {
            background-color: rgba(0, 0, 0, 0.85);
            font-weight: 700;
            font-family: inherit;
            font-style: italic;
            font-size: 1rem;
            letter-spacing: 1.5px;
            min-height: 55px;
            color: white;
            transform: skewX(-12deg);
            box-shadow: 6px 6px 0px var(--neon-red);
            border: 1px solid rgba(255, 51, 51, 0.4);
            margin-bottom: 15px;
            cursor: pointer;
            position: relative;
            z-index: 20;
            transition: all 0.1s;
            text-transform: uppercase;
            width: 100%;
        }

        .kingdom-btn:active {
            transform: skewX(-12deg) translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--neon-red) !important;
        }

        .kingdom-btn span { display: block; transform: skewX(12deg); pointer-events: none; }
        .green-btn { box-shadow: 6px 6px 0px var(--neon-green) !important; border-color: rgba(0, 255, 102, 0.4) !important; }
        .blue-btn { box-shadow: 6px 6px 0px var(--neon-blue) !important; border-color: rgba(0, 204, 255, 0.4) !important; }

        .spin-btn-rounded {
            background: linear-gradient(135deg, var(--neon-green), #00cc55);
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            color: black;
            font-family: inherit;
            font-weight: 900;
            font-style: italic;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4), 0 5px 0 #008833;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            margin-top: 25px;
            z-index: 25;
            opacity: 1;
            transform: translateY(0);
        }

        .spin-btn-rounded.red-variant {
            background: linear-gradient(135deg, var(--neon-red), #cc0000);
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4), 0 5px 0 #880000;
            color: white;
        }

        .spin-btn-rounded.result-state {
            padding: 10px 25px;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .spin-btn-rounded:active {
            transform: translateY(3px);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2), 0 2px 0 #008833;
        }

        .spin-btn-hidden {
            opacity: 0;
            transform: translateY(50px);
            pointer-events: none;
        }

        /* LAYOUTS */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            z-index: 5;
        }

        .instruction-box {
            padding: 12px 35px;
            background: var(--panel-bg);
            transform: skewX(-10deg);
            border-left: 6px solid var(--neon-red);
            margin-bottom: 30px;
            box-shadow: 8px 8px 15px rgba(0,0,0,0.5);
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .instruction-text {
            transform: skewX(10deg);
            font-size: 1.3rem;
            font-weight: 700;
            font-style: italic;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
        }

        .slot-outer-container {
            width: 220px;
            height: 220px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px) saturate(150%);
            -webkit-backdrop-filter: blur(15px) saturate(150%);
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.05);
            cursor: pointer;
            z-index: 20;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .slot-reel {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            width: 100%;
            z-index: 7;
            will-change: transform;
        }

        .slot-item {
            height: 220px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            padding: 0 20px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        .slot-emoji-only {
            font-size: 100px;
            z-index: 2;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            font-style: normal;
            display: inline-block;
            line-height: 1;
        }

        .slot-text-only {
            font-size: 1.5rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 10px var(--neon-blue);
            line-height: 1.1;
        }

        .slot-image {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            background-color: #222;
            z-index: 2;
        }

        .universal-spin-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 950px;
            margin-top: 20px;
            position: relative;
            min-height: 400px;
        }

        .challenge-shift-active .spin-main-area {
            transform: translateX(-180px);
        }

        .spin-main-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 21;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .info-reveal-area {
            position: absolute;
            right: 20px;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.6s ease;
            text-align: left;
            width: 350px;
            pointer-events: none;
        }

        .info-reveal-area.visible {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .info-reveal-area h2 {
            font-size: 2.2rem;
            color: var(--neon-blue);
            margin: 0;
            line-height: 1.1;
            text-shadow: 0 0 15px rgba(0, 204, 255, 0.4);
        }

        .info-reveal-area p {
            font-size: 1.1rem;
            color: #ffffff;
            font-weight: 800; 
            margin-top: 15px;
            line-height: 1.5;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* AVATARE & LISTEN */
        .avatar-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            width: 100%;
        }

        .avatar-wrapper { position: relative; width: 60px; height: 60px; }
        .avatar-preview { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--neon-blue); object-fit: cover; }
        .remove-btn { position: absolute; top: -5px; right: -5px; background: var(--neon-red); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 10; font-size: 14px; }

        .hidden { display: none !important; }
        
        input[type="text"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--neon-blue);
            padding: 15px;
            color: white;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
            text-transform: uppercase;
        }

        .animate-in { animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-challenge-list {
            text-align: left;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            width: 100%;
            box-sizing: border-box;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .type-tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 10px;
            vertical-align: middle;
        }
        .tag-global { background: #555; }
        .tag-kingdom { background: var(--neon-blue); color: black; }

        .upload-status {
            position: fixed;
            bottom: 20px;
            background: var(--neon-green);
            color: black;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 100;
            display: none;
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body onload="initApp()">

    <div id="status-msg" class="upload-status">DATEI IMPORTIERT!</div>

    <div class="bg-wrapper">
        <div id="bg-image"></div>
    </div>

    <!-- Audio Elemente -->
    <audio id="slot-sound" src="https://audio.jukehost.co.uk/3Rqe6hD6BjSdYrmym4G6hyQjAHbger0r" preload="auto"></audio>
    <audio id="break-sound" src="https://audio.jukehost.co.uk/n9iu9jsI2pRQ2Zn3LiahiKs27CxD69Ot" preload="auto"></audio>

    <!-- Hauptmenü -->
    <div id="main-menu" class="animate-in" style="margin-top: 60px; width: 300px; display: flex; flex-direction: column; z-index: 25;">
        <div class="logo-container">
            <img src="https://i.imgur.com/v5PPcVA.png" alt="Logo" class="main-logo">
        </div>
        <button class="kingdom-btn blue-btn" onclick="showSection('kingdom-spin')"><span>🎡 KINGDOM RAD</span></button>
        <button class="kingdom-btn green-btn" onclick="showSection('search')"><span>🔍 SUCHER RAD</span></button>
        <button class="kingdom-btn" onclick="showSection('kingdoms')"><span>🏆 CHALLENGES</span></button>
    </div>

    <!-- Kingdom Spin Sektion -->
    <div id="kingdom-spin-section" class="hidden animate-in" style="width: 100%; flex-direction: column; align-items: center; z-index: 25;">
        <div class="section-header">
            <button class="back-btn" onclick="showSection('menu')"><span>← ZURÜCK</span></button>
            <div class="logo-container"><img src="https://i.imgur.com/v5PPcVA.png" alt="Logo" class="main-logo"></div>
        </div>
        <div class="instruction-box" style="border-color: var(--neon-blue);"><span class="instruction-text">ZUFÄLLIGES KINGDOM</span></div>

        <div id="kingdom-layout" class="universal-spin-layout">
            <div class="spin-main-area">
                <div id="kingdom-slot-container" class="slot-outer-container" onclick="triggerShatter('kingdom')">
                    <div id="kingdom-reel" class="slot-reel">
                        <div class="slot-item" id="kingdom-initial-slot"></div>
                    </div>
                </div>
                <button id="kingdom-spin-btn" class="spin-btn-rounded" onclick="triggerShatter('kingdom')">KINGDOM WÄHLEN</button>
            </div>
            <div id="kingdom-info-panel" class="info-reveal-area">
                <h2 id="kingdom-winner-name"></h2>
                <p id="kingdom-winner-desc">Bereit machen zum Verstecken!</p>
            </div>
        </div>
    </div>

    <!-- Kingdom Auswahl -->
    <div id="kingdoms-section" class="hidden animate-in" style="width: 100%; flex-direction: column; align-items: center; z-index: 25;">
        <div class="section-header">
            <button class="back-btn" onclick="showSection('menu')"><span>← ZURÜCK</span></button>
            <div class="logo-container"><img src="https://i.imgur.com/v5PPcVA.png" alt="Logo" class="main-logo"></div>
        </div>
        <div class="instruction-box"><span class="instruction-text">KÖNIGREICH FÜR CHALLENGE</span></div>
        <div class="grid-container" id="kingdom-grid"></div>
    </div>

    <!-- Challenge Spin Sektion -->
    <div id="challenge-spin-section" class="hidden animate-in" style="width: 100%; flex-direction: column; align-items: center; z-index: 25;">
        <div class="section-header">
            <button class="back-btn" onclick="showSection('kingdoms')"><span>← ZURÜCK</span></button>
            <div class="logo-container"><img src="https://i.imgur.com/v5PPcVA.png" alt="Logo" class="main-logo"></div>
        </div>
        <div class="instruction-box" style="border-color: var(--neon-green);"><span id="spin-title" class="instruction-text">KINGDOM CHALLENGE</span></div>

        <div id="challenge-layout" class="universal-spin-layout">
            <div class="spin-main-area">
                <div id="challenge-slot-container" class="slot-outer-container" onclick="triggerShatter('challenge')">
                    <div id="challenge-reel" class="slot-reel">
                        <div class="slot-item" id="challenge-initial-slot"></div>
                    </div>
                </div>
                <button id="challenge-spin-btn" class="spin-btn-rounded" onclick="triggerShatter('challenge')">SPIN STARTEN</button>
            </div>
            <div id="challenge-info-panel" class="info-reveal-area">
                <h2 id="winner-name-text"></h2>
                <p id="challenge-desc-text"></p>
            </div>
        </div>
    </div>

    <!-- Sucher Sektion -->
    <div id="search-section" class="hidden animate-in" style="width: 100%; flex-direction: column; align-items: center; z-index: 25;">
        <div class="section-header">
            <button class="back-btn" onclick="showSection('menu')"><span>← ZURÜCK</span></button>
            <div class="logo-container"><img src="https://i.imgur.com/v5PPcVA.png" alt="Logo" class="main-logo"></div>
        </div>
        <div class="instruction-box" style="border-color: var(--neon-blue);"><span class="instruction-text">SUCHER AUSWAHL</span></div>

        <div id="search-layout" class="universal-spin-layout">
            <div class="spin-main-area">
                <div id="search-slot-container" class="slot-outer-container" onclick="triggerShatter('search')">
                    <div id="search-reel" class="slot-reel">
                        <div class="slot-item" id="search-initial-slot"></div>
                    </div>
                </div>
                <button id="search-spin-btn" class="spin-btn-rounded" onclick="triggerShatter('search')">WER SUCHT?</button>
                
                <input type="file" id="file-input" accept="image/*" style="display: none;" multiple onchange="handleFileUpload(event)">
                <button class="spin-btn-rounded red-variant" onclick="document.getElementById('file-input').click()" style="margin-top: 15px;">SPIELER HINZUFÜGEN</button>
            </div>
        </div>
        <div id="avatar-container" class="avatar-list"></div>
    </div>

    <!-- Challenges Verwalten -->
    <div id="manage-section" class="hidden animate-in" style="width: 100%; max-width: 600px; flex-direction: column; align-items: center; z-index: 25;">
        <div class="section-header">
            <button class="back-btn" onclick="showSection('kingdoms')"><span>← ZURÜCK</span></button>
            <div class="logo-container"><img src="https://i.imgur.com/v5PPcVA.png" alt="Logo" class="main-logo"></div>
        </div>
        <div class="instruction-box"><span class="instruction-text">CHALLENGE LISTE</span></div>
        <input type="text" id="new-challenge-input" placeholder="💡 Z.B. {WOODED} 🥜 NUSS-VERSTECK...">
        
        <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 15px;">
            <button class="kingdom-btn green-btn" onclick="addCustomChallenge()" style="margin-bottom: 0;"><span>SPEICHERN</span></button>
            <button class="kingdom-btn" onclick="document.getElementById('txt-input').click()" style="margin-bottom: 0; box-shadow: 6px 6px 0px var(--neon-blue); border-color: var(--neon-blue);"><span>TXT IMPORT</span></button>
        </div>
        <input type="file" id="txt-input" accept=".txt" style="display: none;" onchange="handleTxtUpload(event)">
        <div class="custom-challenge-list" id="manage-list"></div>
    </div>

    <script>

            "{ALLGEMEIN} 🇪REIHE E (Verstecke dich in Reihe E)",
            "{ALLGEMEIN} 1️⃣SPALTE 1 (Verstecke dich in Spalte 1)",
            "{ALLGEMEIN} 2️⃣SPALTE 2 (Verstecke dich in Spalte 2)",
            "{ALLGEMEIN} 3️⃣SPALTE 3 (Verstecke dich in Spalte 3)",
            "{ALLGEMEIN} 4️⃣SPALTE 4 (Verstecke dich in Spalte 4)",
            "{ALLGEMEIN} 5️⃣SPALTE 5 (Verstecke dich in Spalte 5)",
            "{SEASIDE} 🛌ENTSPANNEN (Chill dich auf eine Liege)",
            "{SEASIDE} 🐟FISCH (Verstecke dich im Wasser)",
            "{SEASIDE} 🏐VOLLEYBALL (Spiele bis 15 Punkte Volleyball)",
            "{SEASIDE} 🐙OCTUPUS (Verstecke dich als Düsenkrake)",
            "{WOODED} 🥜NNN VERLOREN (Verstecke dich bei einer Nuss)",
            "{WOODED} 🧅ZWIEBEL ENJOYER (Verstecke dich als Uproot)",
            "{WOODED} 🌲BAUM LOVER (Kuschel mit einem Baum für 2 Minuten)",
            "{WOODED} 🐑BAUER (Gehe in die Schaf Subarea)",
            "{CASCADE} 🐱‍🐉PALÄONTOLOGE (Verstecke dich in der DinoSUBarea)",
            "{CASCADE} 🏴‍☠️SCHATZSUCHER (Verstecke dich in der Schatztruhe)",

            "{CAP} 💦RUTSCHEN ENJOYER (Rutsche 3 mal die Rutsche herunter)",
            "{SAND} 🦁JAXI (Düs mit Jaxi durch die Wüste)",
            "{SAND} 🚪GEHEIMES KÄMMERCHEN (Kammer unter dem Treibsand)",
            "{SAND} 🗿MOE-EYE (Verstecke dich als Moe-Eye)",
            "{METRO} 🛵ROLLSTUHLFAHRER (Bewege dich mit dem Roller fort)",
            "{METRO} 🧹MÜLLABFUHR (Verstecke dich in der Mülltonne)",
            "{METRO} 🕺TÄNZER (Tanze für 2 Minuten im Rathaus)",
            "{METRO} 🔤ANAL-PHABET (Kaper Buchstaben und schreibe 'Mario' falsch)",
            "{BOWSER} 🐢DAZIZZLE (Laterne beim Bowser Kopf)",
            "{BOWSER} 🎣ANGLER (Kaper Lakitu und angel 2 Fische)",
            "{BOWSER} 🌾GÄRTNER (Planze die Nut ein)",
            "{BOWSER} 🔝GABELSTAPLER (Stapel 8 Gumbas)",
            "{MOON} 👰BRAUT (Verstecke dich in der Kirche)",
            "{LOST} 🌲HUEBI (Hänge dich in einen Baum)",
            "{LOST} 🧐SAUSIA (Chill mit Glydon)",
            "{LAKE} 🍄TOADS BESTER FREUND (Hinter Captain Toads Zelt)",
            "{LAKE} 🐢LETSMILI (Verstecke dich in Lakitu)",
            "{LUNCHEON} 👨‍🍳CHEFKOCH (Wirf 3 Rüben in den Topf)",
            "{LUNCHEON} 🧀TANZ DEN KÄSE (Verstecke dich im Käse)",
            "{LUNCHEON} 🍴FETTSACK (Rede die ganze Zeit über Essen)",
            "{LUNCHEON} 🍴POKEMON ESSER (Iss so viel du kannst)",
            "{SNOW} ❄SCHNEEENGEL (Tiefschnee Subarea)",
            "{SNOW} 🌬BLASI BLASI (Verstecke dich als Wolke)",
            "{MUSHROOM} 🚪HANDWERKER (Auf der Tür verstecken)",
            "{MUSHROOM} 🗼DACHDECKER (Verstecke dich auf einem Turm)",
            "{CLOUD} 🕹NOSTALGIKER (2D Subarea)",
            "{RUINED} 🐉DRACHENLORD (Verstecke dich auf dem Drachen)"
        ];

        let customChallenges = JSON.parse(localStorage.getItem('hns_challenges')) || INITIAL_CHALLENGES;
        const slotSound = document.getElementById('slot-sound');
        const breakSound = document.getElementById('break-sound');

        breakSound.onended = () => {
            if (pendingSpinType) {
                const type = pendingSpinType;
                pendingSpinType = null;
                if (type === 'kingdom') startKingdomSpin();
                else if (type === 'challenge') startChallengeSlot();
                else if (type === 'search') startSearchSlot();
            }
        };

        function playSlotSound() { 
            slotSound.currentTime = 0; 
            slotSound.play().catch(() => {}); 
        }

        function playBreakSound() { 
            breakSound.currentTime = 0; 
            breakSound.play().catch(() => {}); 
        }

        function initApp() {
            initKingdoms();
            renderManageList();
        }

        function initKingdoms() {
            const grid = document.getElementById('kingdom-grid');
            if(!grid) return;
            grid.innerHTML = '';
            kingdoms.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'kingdom-btn';
                btn.innerHTML = `<span>${name}</span>`;
                btn.onclick = () => openChallengeSpin(name);
                grid.appendChild(btn);
            });
            const allBtn = document.createElement('button');
            allBtn.className = 'kingdom-btn green-btn';
            allBtn.innerHTML = `<span>ALLE CHALLENGES</span>`;
            allBtn.onclick = () => showSection('manage');
            grid.appendChild(allBtn);

            setupShatterHTML('kingdom');
            setupShatterHTML('challenge');
            setupShatterHTML('search');
        }

        function setupShatterHTML(type) {
            const container = document.getElementById(type + '-initial-slot');
            if(!container) return;
            let shatterHTML = `<div class="item-box-placeholder" id="${type}-box"></div><div class="shatter-container" id="${type}-shatter">`;
            for(let r=0; r<4; r++) {
                for(let c=0; c<4; c++) {
                    const bx = c * 35; const by = r * 35;
                    shatterHTML += `<div class="shatter-piece" style="left:${bx}px; top:${by}px; background-position:-${bx}px -${by}px;"></div>`;
                }
            }
            shatterHTML += `</div>`;
            container.innerHTML = shatterHTML;
        }

        function showSection(section) {
            ['main-menu', 'kingdoms-section', 'search-section', 'manage-section', 'challenge-spin-section', 'kingdom-spin-section'].forEach(id => {
                const el = document.getElementById(id);
                if (el) { el.classList.add('hidden'); el.style.display = 'none'; }
            });

            const targetId = section === 'menu' ? 'main-menu' : section + '-section';
            const target = document.getElementById(targetId);
            if (target) { target.style.display = 'flex'; target.classList.remove('hidden'); }
            
            if(section === 'manage') renderManageList();
            if(section.includes('spin') || section === 'search') {
                const type = section.split('-')[0];
                resetUI(type);
            }
        }

        function resetUI(type) {
            const panel = document.getElementById(type + '-info-panel');
            const btn = document.getElementById(type + '-spin-btn');
            const reel = document.getElementById(type + '-reel');
            const layout = document.getElementById(type + '-layout');
            const box = document.getElementById(type + '-box');
            const shatter = document.getElementById(type + '-shatter');
            
            if (panel) panel.classList.remove('visible');
            if (layout) layout.classList.remove('challenge-shift-active'); 
            if (btn) {
                btn.classList.remove('spin-btn-hidden');
                btn.classList.remove('result-state');
                btn.innerText = type === 'search' ? 'WER SUCHT?' : (type === 'kingdom' ? 'KINGDOM WÄHLEN' : 'SPIN STARTEN');
            }
            if (box) box.style.opacity = '1';
            if (shatter) { shatter.style.display = 'none'; shatter.classList.remove('shatter-active'); }
            if (reel) {
                reel.innerHTML = `<div class="slot-item" id="${type}-initial-slot"></div>`;
                setupShatterHTML(type);
                reel.style.transform = 'translateY(0)';
                reel.style.transition = 'none';
            }
            pendingSpinType = null;
        }

        function triggerShatter(type) {
            if (isSpinning) return;
            const btn = document.getElementById(type + '-spin-btn');
            if(btn && btn.classList.contains('result-state')) { resetUI(type); return; }
            if (type === 'search' && players.length === 0) return;

            isSpinning = true;
            pendingSpinType = type; 
            
            playBreakSound();

            const box = document.getElementById(type + '-box');
            const shatter = document.getElementById(type + '-shatter');
            if (box && shatter) {
                const pieces = shatter.querySelectorAll('.shatter-piece');
                pieces.forEach(p => {
                    p.style.setProperty('--tx', `${(Math.random() - 0.5) * 400}px`);
                    p.style.setProperty('--ty', `${(Math.random() - 0.5) * 400}px`);
                    p.style.setProperty('--tr', `${(Math.random() - 0.5) * 1080}deg`);
                });
                box.style.opacity = '0';
                shatter.style.display = 'block';
                shatter.classList.add('shatter-active');
            }
            const spinBtn = document.getElementById(type + '-spin-btn');
            if(spinBtn) spinBtn.classList.add('spin-btn-hidden');
        }

        function openChallengeSpin(name) {
            currentKingdom = name.trim().toUpperCase();
            document.getElementById('spin-title').innerText = name;
            showSection('challenge-spin');
        }

        function parseChallenge(text) {
            let kingdomTag = null;
            let namePart = text.trim();
            let desc = "Verstecke dich gut!";
            let emoji = "✨";
            
            const kingdomMatch = namePart.match(/^[\{\[](.*?)[\}\]]\s*(.*)$/);
            if (kingdomMatch) { 
                kingdomTag = kingdomMatch[1].trim().toUpperCase(); 
                namePart = kingdomMatch[2].trim(); 
            }
            
            const descMatch = namePart.match(/^(.*?)\s*\((.*?)\)$/);
            if (descMatch) { 
                namePart = descMatch[1].trim(); 
                desc = descMatch[2].trim(); 
            }
            
            const keycapMatch = namePart.match(/^([0-9#*]\uFE0F?\u20E3)/);
            if (keycapMatch) {
                emoji = keycapMatch[1];
                namePart = namePart.substring(emoji.length).trim();
            } else {
                const emojiRegex = /^(\u00a9|\u00ae|[\u2000-\u3300]|\ud83c[\ud000-\udfff]|\ud83d[\ud000-\udfff]|\ud83e[\ud000-\udfff])[\ufe00-\ufe0f\u200d]*/;
                const emMatch = namePart.match(emojiRegex);
                if (emMatch) {
                    emoji = emMatch[0];
                    namePart = namePart.substring(emoji.length).trim();
                }
            }
            
            return { kingdomTag, emoji, name: namePart || "CHALLENGE", desc };
        }

        function startKingdomSpin() {
            playSlotSound();
            const reel = document.getElementById('kingdom-reel');
            const spinCount = 20;
            let reelHtml = '';
            for (let i = 0; i < spinCount; i++) {
                reelHtml += `<div class="slot-item"><div class="slot-text-only">${kingdoms[Math.floor(Math.random() * kingdoms.length)]}</div></div>`;
            }
            const winner = kingdoms[Math.floor(Math.random() * kingdoms.length)];
            reelHtml += `<div class="slot-item"><div class="slot-text-only">${winner}</div></div>`;
            reel.innerHTML = reelHtml;
            setTimeout(() => {
                reel.style.transition = 'transform 3.5s cubic-bezier(0.1, 0, 0.2, 1)';
                reel.style.transform = `translateY(-${spinCount * 220}px)`;
            }, 50);

            setTimeout(() => {
                document.getElementById('kingdom-winner-name').innerText = winner;
                document.getElementById('kingdom-info-panel').classList.add('visible');
                document.getElementById('kingdom-layout').classList.add('challenge-shift-active');
                const btn = document.getElementById('kingdom-spin-btn');
                btn.innerText = "NOCHMAL WÄHLEN";
                btn.classList.remove('spin-btn-hidden');
                btn.classList.add('result-state');
                isSpinning = false;
            }, 3700);
        }

        function startChallengeSlot() {
            playSlotSound();
            const reel = document.getElementById('challenge-reel');
            let pool = customChallenges.map(text => parseChallenge(text)).filter(p => {
                if (!p.kingdomTag || p.kingdomTag === "ALLGEMEIN") return true;
                return currentKingdom.includes(p.kingdomTag);
            });
            if (pool.length === 0) pool = [{ name: "Keine Challenges", desc: "...", emoji: "⚠️" }];

            const spinCount = 25;
            let reelHtml = '';
            for (let i = 0; i < spinCount; i++) {
                const r = pool[Math.floor(Math.random() * pool.length)];
                reelHtml += `<div class="slot-item"><span class="slot-emoji-only">${r.emoji}</span></div>`;
            }
            const winner = pool[Math.floor(Math.random() * pool.length)];
            reelHtml += `<div class="slot-item"><span class="slot-emoji-only">${winner.emoji}</span></div>`;
            reel.innerHTML = reelHtml;
            setTimeout(() => {
                reel.style.transition = 'transform 3.5s cubic-bezier(0.1, 0, 0.2, 1)';
                reel.style.transform = `translateY(-${spinCount * 220}px)`;
            }, 50);

            setTimeout(() => {
                document.getElementById('winner-name-text').innerText = winner.name.toUpperCase();
                document.getElementById('challenge-desc-text').innerText = winner.desc;
                document.getElementById('challenge-info-panel').classList.add('visible');
                document.getElementById('challenge-layout').classList.add('challenge-shift-active');
                const btn = document.getElementById('challenge-spin-btn');
                btn.innerText = "NOCHMAL SPINNEN";
                btn.classList.remove('spin-btn-hidden');
                btn.classList.add('result-state');
                isSpinning = false;
            }, 3700);
        }

        function startSearchSlot() {
            playSlotSound();
            const reel = document.getElementById('search-reel');
            const spinCount = 30;
            let reelHtml = '';
            for (let i = 0; i < spinCount; i++) { reelHtml += `<div class="slot-item"><img src="${players[Math.floor(Math.random() * players.length)]}" class="slot-image"></div>`; }
            const winner = players[Math.floor(Math.random() * players.length)];
            reelHtml += `<div class="slot-item"><img src="${winner}" class="slot-image"></div>`;
            reel.innerHTML = reelHtml;
            setTimeout(() => {
                reel.style.transition = 'transform 3.5s cubic-bezier(0.1, 0, 0.2, 1)';
                reel.style.transform = `translateY(-${spinCount * 220}px)`;
            }, 50);
            setTimeout(() => {
                const btn = document.getElementById('search-spin-btn');
                btn.innerText = "NOCHMAL?";
                btn.classList.remove('spin-btn-hidden');
                btn.classList.add('result-state');
                isSpinning = false;
            }, 3700);
        }

        function handleFileUpload(event) {
            const files = event.target.files;
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = (e) => { players.push(e.target.result); renderAvatars(); };
                reader.readAsDataURL(file);
            }
        }

        function renderAvatars() {
            const container = document.getElementById('avatar-container');
            container.innerHTML = '';
            players.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'avatar-wrapper animate-in';
                div.innerHTML = `<img src="${p}" class="avatar-preview"><button class="remove-btn" onclick="players.splice(${i},1);renderAvatars()">×</button>`;
                container.appendChild(div);
            });
        }

        function addCustomChallenge() {
            const input = document.getElementById('new-challenge-input');
            const val = input.value.trim();
            if (val) { customChallenges.unshift(val); localStorage.setItem('hns_challenges', JSON.stringify(customChallenges)); input.value = ''; renderManageList(); }
        }

        function renderManageList() {
            const list = document.getElementById('manage-list');
            if(!list) return;
            list.innerHTML = '';
            customChallenges.forEach((ch, i) => {
                const p = parseChallenge(ch);
                const div = document.createElement('div');
                div.style = "display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #333; font-size: 0.85rem;";
                div.innerHTML = `
                    <div style="flex:1">
                        ${p.emoji} <strong>${p.name.toUpperCase()}</strong> ${p.kingdomTag ? `<span class="type-tag tag-kingdom">${p.kingdomTag}</span>` : `<span class="type-tag tag-global">GLOBAL</span>`}
                        <div style="font-size: 0.75rem; color: #888; margin-top: 4px;">${p.desc}</div>
                    </div>
                    <button style="background:none; border:none; color:var(--neon-red); cursor:pointer; font-weight:bold; padding: 10px;" onclick="customChallenges.splice(${i},1);localStorage.setItem('hns_challenges', JSON.stringify(customChallenges));renderManageList();">DEL</button>
                `;
                list.appendChild(div);
            });
        }

        function handleTxtUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.split('\n').map(l => l.trim()).filter(l => l.length > 0 && !l.startsWith('{'));
                if(lines.length > 0) {
                    customChallenges = [...lines, ...customChallenges];
                    localStorage.setItem('hns_challenges', JSON.stringify(customChallenges));
                    renderManageList();
                    const msg = document.getElementById('status-msg');
                    msg.style.display = 'block'; setTimeout(() => msg.style.display = 'none', 3000);
                }
            };
            reader.readAsText(file);
        }
    </script>
